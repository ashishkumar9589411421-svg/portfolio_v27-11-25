<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashish Kumar | RESUME </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #030014; /* Deep dark background */
        }

        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .lucide {
            display: inline-block;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;

    </style>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = Motion;

        // Icon Components using Lucide
        const Icon = ({ name, className = "", size = 24, ...props }) => {
            useEffect(() => {
                if(window.lucide) lucide.createIcons();
            }, [name]);
            
            return React.createElement('i', {
                'data-lucide': name,
                className: className,
                ...props
            });
        };

        function App() {
            const [currentPage, setCurrentPage] = useState(0);
            const [flippedPages, setFlippedPages] = useState([]);
            // New state for parallax effect
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                if(window.lucide) lucide.createIcons();
            }, [flippedPages, currentPage]);

            // Mouse Move Handler for Live Background
            useEffect(() => {
                const handleMouseMove = (e) => {
                    setMousePos({
                        x: (e.clientX / window.innerWidth) * 2 - 1,
                        y: (e.clientY / window.innerHeight) * 2 - 1
                    });
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            const totalPages = 4;

            const flipNext = (pageIndex) => {
                if (!flippedPages.includes(pageIndex)) {
                    setFlippedPages([...flippedPages, pageIndex]);
                    setCurrentPage(pageIndex);
                }
            };

            const flipBack = (pageIndex) => {
                if (flippedPages.includes(pageIndex)) {
                    setFlippedPages(flippedPages.filter(p => p !== pageIndex));
                    setCurrentPage(pageIndex - 1);
                }
            };

            const isFlipped = (pageIndex) => flippedPages.includes(pageIndex);

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-[#030014] overflow-hidden relative">
                    
                    {/* --- Dynamic Background Layer --- */}
                    <motion.div 
                        className="absolute inset-0 overflow-hidden pointer-events-none"
                        animate={{
                            x: mousePos.x * -20, // Move opposite to mouse
                            y: mousePos.y * -20
                        }}
                        transition={{ type: 'spring', stiffness: 50, damping: 20 }}
                    >
                        {/* Grid Pattern Overlay */}
                        <div className="absolute inset-0 opacity-20" 
                             style={{
                                backgroundImage: 'linear-gradient(rgba(100, 116, 139, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(100, 116, 139, 0.3) 1px, transparent 1px)',
                                backgroundSize: '40px 40px'
                             }}>
                        </div>

                        {/* Animated Glowing Orbs */}
                        <motion.div
                            className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[100px]"
                            animate={{
                                scale: [1, 1.2, 1],
                                x: [0, 50, 0],
                                opacity: [0.3, 0.5, 0.3],
                            }}
                            transition={{ duration: 10, repeat: Infinity, ease: "easeInOut" }}
                        />
                        <motion.div
                            className="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[100px]"
                            animate={{
                                scale: [1.2, 1, 1.2],
                                x: [0, -50, 0],
                                opacity: [0.2, 0.4, 0.2],
                            }}
                            transition={{ duration: 12, repeat: Infinity, ease: "easeInOut" }}
                        />
                        <motion.div
                            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyan-500/10 rounded-full blur-[120px]"
                            animate={{ rotate: [0, 360] }}
                            transition={{ duration: 40, repeat: Infinity, ease: "linear" }}
                        />
                    </motion.div>

                    {/* Floating Star Particles */}
                    {[...Array(30)].map((_, i) => (
                        <motion.div
                            key={i}
                            className="absolute w-1 h-1 bg-white rounded-full shadow-[0_0_10px_white]"
                            style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                            }}
                            animate={{
                                y: [0, -40, 0],
                                opacity: [0, 0.8, 0],
                                scale: [0, 1, 0]
                            }}
                            transition={{
                                duration: 2 + Math.random() * 4,
                                repeat: Infinity,
                                delay: Math.random() * 3,
                            }}
                        />

                                            <div className="w-2 h-2 rounded-full bg-slate-400"></div>
                                        </div>

                                                    >

                                                        whileTap={{ scale: 0.95 }}
                                                    >
                                                        <Icon name="linkedin" className="w-7 h-7" />
                                                    </motion.a>

                                                    {/* Instagram */}

                                                        href="https://instagram.com"

                                                        whileHover={{ scale: 1.15, y: -5 }}
                                                        whileTap={{ scale: 0.95 }}
                                                    >
                                                        <Icon name="instagram" className="w-7 h-7" />
                                                    </motion.a>
                                                </div>
                                            </div>
                                        </motion.div>

                                        <motion.button
                                            onClick={() => flipBack(4)}
                                            className="absolute bottom-6 left-6 w-12 h-12 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center transition-colors shadow-sm cursor-pointer z-50"
                                            whileHover={{ scale: 1.1 }}
                                            whileTap={{ scale: 0.9 }}
                                        >
                                            <Icon name="chevron-left" className="w-6 h-6 text-slate-600" />
                                        </motion.button>
                                    </div>
                                </PageFront>
                                <PageBack>
                                    <div className="h-full flex items-center justify-center bg-gradient-to-br from-indigo-50 to-white">
                                        <motion.div
                                            initial={{ scale: 0 }}
                                            animate={{ scale: 1 }}
                                            transition={{ type: "spring", stiffness: 200 }}
                                            className="text-center"
                                        >
                                            <motion.div
                                                animate={{ rotate: 360, scale: [1, 1.1, 1] }}
                                                transition={{ duration: 3, repeat: Infinity }}
                                                className="inline-block mb-6 relative"
                                            >
                                                <div className="absolute inset-0 bg-violet-400 blur-2xl opacity-30"></div>
                                                <Icon name="sparkles" className="w-24 h-24 text-violet-500 relative z-10" size={80} />
                                            </motion.div>
                                            <h3 className="text-3xl font-bold text-slate-800">Thank You!</h3>
                                            <p className="text-slate-500 mt-2 font-medium">End of RESUME</p>
                                        </motion.div>
                                    </div>
                                </PageBack>
                            </Page>

                            {/* Page 3 - Projects & Skills */}
                            <Page pageIndex={3} isFlipped={isFlipped(3)} totalPages={totalPages}>
                                <PageFront>
                                    <div className="h-full flex flex-col p-10 bg-slate-50/80">
                                        <motion.h2
                                            initial={{ opacity: 0, y: -20 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            className="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600"
                                        >
                                            MY PROJECTS
                                        </motion.h2>
                                        <div className="h-1 w-20 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full mb-6"></div>

                                        <div className="flex-1 space-y-5 overflow-y-auto pr-2 custom-scrollbar">
                                            {[
                                                {
                                                    title: 'OBITO AI Assistant',
                                                    desc: 'Python-based desktop automation tool using voice commands. Features natural language processing.',
                                                    gradient: 'from-fuchsia-600 to-purple-600',
                                                    icon: 'bot'
                                                },
                                                {
                                                    title: 'TimeJet',
                                                    desc: 'Productivity app for tracking time and improving workflow. Built with modern UI/UX principles.',
                                                    gradient: 'from-blue-500 to-cyan-500',
                                                    icon: 'clock'
                                                },
                                                {
                                                    title: 'MadAsGalaxyClock',
                                                    desc: 'A visually stunning digital clock with galaxy animations. WebGL-powered graphics.',
                                                    gradient: 'from-indigo-500 to-violet-500',
                                                    icon: 'star'
                                                },
                                                {
                                                    title: 'Navya Jewellers',
                                                    desc: 'E-commerce website for a jewelry brand with payment integration and inventory management.',
                                                    gradient: 'from-amber-500 to-orange-500',
                                                    icon: 'shopping-bag'
                                                }
                                            ].map((project, idx) => (
                                                <motion.div
                                                    key={idx}
                                                    initial={{ opacity: 0, x: -20 }}

                                                    transition={{ delay: idx * 0.1 }}
                                                    whileHover={{ scale: 1.02, x: 5 }}
                                                    className="group relative p-4 bg-white rounded-xl shadow-md border border-slate-100 hover:shadow-xl transition-all overflow-hidden"
                                                >
                                                    <div className={`absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b ${project.gradient}`}></div>
                                                    <div className="flex justify-between items-start mb-2">

                                                        <Icon name={project.icon} className="w-5 h-5 text-slate-400" />
                                                    </div>
                                                    <p className="text-slate-600 text-sm leading-relaxed">{project.desc}</p>

                                        </div>

                                        <motion.button
                                            onClick={() => flipNext(3)}

                                            whileHover={{ scale: 1.1 }}

                                        >
                                            <Icon name="chevron-right" className="w-6 h-6 text-slate-700" />

                                    </div>
                                </PageFront>
                                <PageBack>
                                    <div className="h-full flex flex-col items-center justify-center p-10 bg-gradient-to-br from-slate-50 to-slate-100">
                                        <motion.div
                                            initial={{ scale: 0, rotate: -180 }}
                                            animate={{ scale: 1, rotate: 0 }}
                                            transition={{ type: "spring", stiffness: 100 }}
                                            className="text-center"
                                        >
                                            <div className="w-32 h-32 mx-auto mb-6 bg-white rounded-2xl shadow-xl flex items-center justify-center">
                                                <Icon name="code-2" className="w-16 h-16 text-cyan-500" size={64} />
                                            </div>
                                            <h2 className="text-3xl font-bold text-slate-800 mb-4">My Work</h2>
                                            <p className="text-slate-600 text-lg">Flip to see what I've built</p>
                                            <motion.div
                                                animate={{ x: [0, 10, 0] }}
                                                transition={{ duration: 1.5, repeat: Infinity }}
                                                className="mt-8"
                                            >
                                                <Icon name="chevron-right" className="w-10 h-10 text-cyan-500 mx-auto" size={40} />
                                            </motion.div>
                                        </motion.div>

                                        <motion.button
                                            onClick={() => flipBack(2)}
                                            className="absolute bottom-6 left-6 w-12 h-12 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center transition-colors cursor-pointer z-50"
                                            whileHover={{ scale: 1.1 }}
                                            whileTap={{ scale: 0.9 }}
                                        >
                                            <Icon name="chevron-left" className="w-6 h-6 text-slate-600" />
                                        </motion.button>
                                    </div>
                                </PageBack>
                            </Page>

                            {/* Page 1 - Cover (Redesigned) */}
                            <Page pageIndex={1} isFlipped={isFlipped(1)} totalPages={totalPages} isCover={true}>
                                <PageFront isCover={true}>
                                    <div className="h-full flex flex-col items-center justify-center p-10 text-center relative overflow-hidden">
                                        {/* Cover Effects */}
                                        <div className="absolute inset-0 bg-gradient-to-br from-indigo-950 via-[#0B1120] to-black opacity-90 z-0"></div>
                                        <div className="absolute inset-0 opacity-30 z-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
                                        
                                        <div className="relative z-10 flex flex-col items-center">
                                            <motion.div
                                                initial={{ scale: 0 }}
                                                animate={{ scale: 1 }}
                                                transition={{ type: "spring", duration: 1 }}
                                                className="mb-10 relative"
                                            >
                                                <div className="absolute inset-0 bg-cyan-500 blur-3xl opacity-20 rounded-full animate-pulse"></div>
                                                <motion.div
                                                    animate={{ rotate: [0, 360] }}
                                                    transition={{ duration: 20, repeat: Infinity, ease: "linear" }}
                                                    className="border-2 border-cyan-500/30 rounded-full p-6"
                                                >
                                                    <Icon name="sparkles" className="w-20 h-20 text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]" size={80} />
                                                </motion.div>
                                            </motion.div>

                                            <motion.h1
                                                initial={{ opacity: 0, y: -30 }}
                                                animate={{ opacity: 1, y: 0 }}
                                                transition={{ delay: 0.3 }}
                                                className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 mb-6 tracking-widest uppercase drop-shadow-sm"
                                            >
                                            R.E.S.U.M.E 
                                            </motion.h1>

                                            <motion.div
                                                initial={{ scaleX: 0 }}
                                                animate={{ scaleX: 1 }}
                                                transition={{ delay: 0.5 }}
                                                className="w-40 h-1.5 bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 rounded-full mb-8 shadow-[0_0_20px_rgba(6,182,212,0.5)]"
                                            />

                                            <motion.h2
                                                initial={{ opacity: 0 }}
                                                animate={{ opacity: 1 }}
                                                transition={{ delay: 0.7 }}
                                                className="text-2xl font-light text-slate-300 mb-12 tracking-[0.2em]"
                                            >
                                                ASHISH KUMAR
                                            </motion.h2>

                                            <motion.p
                                                initial={{ opacity: 0 }}
                                                animate={{ opacity: 1 }}
                                                transition={{ delay: 0.9 }}
                                                className="text-cyan-400/80 text-sm font-medium uppercase tracking-widest mb-4"
                                            >
                                                Tap to Open
                                            </motion.p>

                                            <motion.button
                                                onClick={() => flipNext(1)}
                                                className="absolute bottom-10 right-10 w-16 h-16 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 flex items-center justify-center transition-all shadow-[0_0_30px_rgba(6,182,212,0.4)] hover:shadow-[0_0_50px_rgba(6,182,212,0.6)] hover:scale-110 border border-white/20 cursor-pointer z-50"
                                                whileHover={{ scale: 1.1 }}
                                                whileTap={{ scale: 0.9 }}
                                            >
                                                <Icon name="arrow-right" className="w-8 h-8 text-white" />
                                            </motion.button>
                                        </div>
                                    </div>
                                </PageFront>
                                <PageBack>
                                    <div className="h-full flex flex-col items-center justify-center p-10 text-center bg-white">
                                        <motion.div
                                            initial={{ scale: 0 }}
                                            animate={{ scale: 1 }}
                                            transition={{ type: "spring", stiffness: 200 }}
                                        >
                                            <h2 className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 mb-4">Welcome</h2>
                                            <p className="text-xl text-slate-500 font-medium">To my interactive digital space</p>
                                            <motion.div
                                                animate={{ rotate: [0, 360] }}
                                                transition={{ duration: 4, repeat: Infinity, ease: "linear" }}
                                                className="mt-10"
                                            >
                                                <Icon name="loader-2" className="w-12 h-12 text-cyan-500 mx-auto opacity-50" size={48} />
                                            </motion.div>
                                        </motion.div>

                                        <motion.button
                                            onClick={() => flipBack(1)}
                                            className="absolute bottom-6 left-6 w-12 h-12 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition-colors cursor-pointer z-50"
                                            whileHover={{ scale: 1.1 }}
                                            whileTap={{ scale: 0.9 }}
                                        >
                                            <Icon name="chevron-left" className="w-6 h-6 text-slate-600" />
                                        </motion.button>
                                    </div>
                                </PageBack>
                            </Page>
                        </motion.div>
                    </motion.div>

                    {/* Progress Indicator */}
                    <div className="fixed bottom-8 left-1/2 -translate-x-1/2 flex gap-3 z-50 p-2 bg-white/5 backdrop-blur-md rounded-full border border-white/10">
                        {[0, 1, 2, 3, 4].map((page) => (
                            <motion.div
                                key={page}
                                className={`h-2 rounded-full transition-all duration-300 ${
                                    currentPage >= page 
                                    ? 'bg-cyan-400 w-8 shadow-[0_0_10px_rgba(34,211,238,0.5)]' 
                                    : 'bg-slate-700 w-2'
                                }`}
                                whileHover={{ scale: 1.2 }}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        // --- FIXED PAGE COMPONENT WITH CORRECT Z-INDEX LOGIC ---
        function Page({ children, pageIndex, isFlipped, totalPages, isCover = false }) {
            const zIndex = isFlipped ? pageIndex : (totalPages - pageIndex);

            return (
                <motion.div
                    className="absolute right-0 top-0 w-1/2 h-full origin-left"
                    style={{
                        transformStyle: 'preserve-3d',
                        zIndex: zIndex, 
                    }}
                    animate={{
                        rotateY: isFlipped ? -180 : 0,
                    }}
                    transition={{
                        duration: 1.2,
                        ease: [0.645, 0.045, 0.355, 1], // Cubic-bezier for realistic heavy page feel
                    }}
                >
                    {children}
                </motion.div>
            );
        }

        // PageFront Component
        function PageFront({ children, isCover = false }) {
            return (
                <div
                    className={`absolute inset-0 ${
                        isCover 
                            ? 'bg-slate-900' 
                            : 'bg-white'
                    } rounded-r-2xl shadow-xl overflow-hidden`}
                    style={{
                        backfaceVisibility: 'hidden',
                        transform: 'rotateY(0deg)',
                    }}
                >
                    {/* Page texture overlay */}
                    {!isCover && (
                        <div 
                            className="absolute inset-0 opacity-[0.03] pointer-events-none"
                            style={{
                                backgroundImage: 'url("https://www.transparenttextures.com/patterns/cream-paper.png")',
                            }}
                        />
                    )}
                    {/* Spine shadow */}
                    <div 
                        className="absolute left-0 top-0 h-full w-12 pointer-events-none z-20"
                        style={{
                            background: 'linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.05) 40%, transparent)',
                        }}
                    />
                    {children}
                </div>
            );
        }

        // PageBack Component
        function PageBack({ children }) {
            return (
                <div
                    className="absolute inset-0 bg-white rounded-l-2xl shadow-xl overflow-hidden"
                    style={{
                        backfaceVisibility: 'hidden',
                        transform: 'rotateY(180deg)',
                    }}
                >
                    {/* Page texture overlay */}
                    <div 
                        className="absolute inset-0 opacity-[0.03] pointer-events-none"
                        style={{
                            backgroundImage: 'url("https://www.transparenttextures.com/patterns/cream-paper.png")',
                        }}
                    />
                    {/* Spine shadow (reversed) */}
                    <div 
                        className="absolute right-0 top-0 h-full w-12 pointer-events-none z-20"
                        style={{
                            background: 'linear-gradient(to left, rgba(0,0,0,0.1), rgba(0,0,0,0.05) 40%, transparent)',
                        }}
                    />
                    {children}
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
